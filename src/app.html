<!doctype html>
<html lang="en" class="theme-light-default" data-theme="theme-light-default" data-mode="light" data-bg-style="plain">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fracta</title>
    %sveltekit.head%
    <!--
      Pre-paint theme stamp. This app is an SPA (ssr = false), so a script
      injected through {@html} in <svelte:head> is inserted with innerHTML and
      never executes — the stamp has to live here, in the static shell.

      It mirrors fractalstyler2's storage contract: fs2.presets (axis values),
      fs2.theme (palette class + its mode), fs2.mode (explicit light/dark).
      With nothing stored, Fracta defaults to light rather than following the OS.
    -->
    <script>
      // Font overrides, stamped before first paint. Without this the app paints
      // in the stylesheet's font and then swaps once the state module loads,
      // which is a visible flash on every launch. Same storage key as
      // src/lib/states/appFonts.svelte.ts.
      try {
        var f = JSON.parse(localStorage.getItem('fracta.appFonts') || '{}');
        var root = document.documentElement;
        if (f.sans) root.style.setProperty('--font-sans', '"' + f.sans + '", sans-serif');
        if (f.mono) root.style.setProperty('--font-mono', '"' + f.mono + '", monospace');
      } catch (e) {
        /* storage unavailable — the stylesheet's fonts stand */
      }
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
