<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fracta</title>
    %sveltekit.head%
    <!--
      Pre-paint theme stamp. This app is an SPA (ssr = false), so a script
      injected through {@html} in <svelte:head> is inserted with innerHTML and
      never executes — the stamp has to live here, in the static shell.

      It mirrors fractalstyler2's storage contract: fs2.presets (axis values),
      fs2.theme (palette class + its mode), fs2.mode (explicit light/dark).
      With nothing stored, Fracta defaults to light rather than following the OS.
    -->
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var presets = JSON.parse(localStorage.getItem('fs2.presets') || '{}');
          for (var axis in presets) {
            if (presets[axis]) root.setAttribute('data-' + axis, presets[axis]);
          }
          var theme = localStorage.getItem('fs2.theme');
          if (theme) {
            root.classList.add(theme);
            root.setAttribute('data-mode', theme.indexOf('-dark') > -1 ? 'dark' : 'light');
          }
          var mode = localStorage.getItem('fs2.mode');
          if (mode === 'dark' || mode === 'light') root.setAttribute('data-mode', mode);
          else if (!theme) root.setAttribute('data-mode', 'light');
        } catch (e) {
          /* storage unavailable — the app's own default applies on mount */
        }
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
